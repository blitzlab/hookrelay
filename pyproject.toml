[project]
name = "hookrelay"
version = "0.1.0"
description = "Reliable at-least-once webhook delivery built with Django, Celery, PostgreSQL and Redis."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
